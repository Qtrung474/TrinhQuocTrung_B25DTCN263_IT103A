<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./07.css">
</head>
<body>
    <section class="stats-section">
        <div class="container stats-box">
            <h2 class="stats-title">Thống Kê Học Tập</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="icon">📚</div>
                    <div class="value">4</div>
                    <div class="label">Tổng khóa học</div>
                </div>
                <div class="stat-card">
                    <div class="icon">🎯</div>
                    <div class="value">2</div>
                    <div class="label">Đang học</div>
                </div>
                <div class="stat-card">
                    <div class="icon">✅</div>
                    <div class="value">1</div>
                    <div class="label">Hoàn thành</div>
                </div>
                <div class="stat-card">
                    <div class="icon">⏰</div>
                    <div class="value">43</div>
                    <div class="label">Giờ học</div>
                </div>
                <div class="stat-card">
                    <div class="icon">📜</div>
                    <div class="value">1</div>
                    <div class="label">Chứng chỉ</div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
