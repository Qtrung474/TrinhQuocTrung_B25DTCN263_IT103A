<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao diện E-learning</title>
    <link rel="stylesheet" href="./05.css">
</head>

<body>

    <header class="main-header">
        <div class="header-content">
            <div class="logo">
                <img src="./1.png" alt="RKEI Edu">
            </div>
            <nav class="navigation">
                <a href="#">Trang chủ</a>
                <a href="#">Khóa học</a>
                <a href="#" class="active">Khóa học của tôi</a>
                <a href="#">Liên hệ</a>
            </nav>
            <div class="user-profile">
                <img src="avatar.jpg" alt="Avatar">
                <span>Nguyễn Văn A</span>
            </div>
        </div>
    </header>

    <section class="banner">
        <h1>Khóa Học Của Tôi</h1>
        <p>Tiếp tục hành trình học tập và phát triển kỹ năng của bạn</p>
    </section>

    <main class="login-section">
        <div class="login-container">
            <form class="login-form">
                <h2>Đăng nhập</h2>
                <p class="form-subtitle">Đăng nhập để sử dụng hệ thống e-learning</p>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="Nhập địa chỉ email">
                </div>

                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" placeholder="Nhập mật khẩu">
                </div>

                <div class="form-actions">
                    <label class="checkbox-container">
                        <input type="checkbox"> Ghi nhớ đăng nhập
                    </label>
                    <a href="#" class="forgot-link">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="btn-submit">Đăng nhập</button>

                <p class="register-text">Chưa có tài khoản? <a href="#">Đăng ký ngay</a></p>
            </form>
        </div>
    </main>

</body>

</html>
