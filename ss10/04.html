<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gourmet Restaurant</title>
    <link rel="stylesheet" href="04.css">
</head>
<body>

    <section class="featured">
        <h2>Món Ăn Nổi Bật ...</h2>
        <p style="color: #666; margin-bottom: 30px;"></p>
        
        <div class="dish-grid">
            <div class="dish-card">
                <div class="image-container">
                    <img src="./anh04/01.jpg" alt="Macaroons">
                    <div class="overlay">Macaroons</div>
                </div>
                <h3>Macaroons</h3>
            </div>

            <div class="dish-card">
                <div class="image-container">
                    <img src="./anh04/02.jpg" alt="Hamburger">
                    <div class="overlay">h3 Oveay</div>
                </div>
                <h3>Hamburger and Fries</h3>
            </div>

            <div class="dish-card">
                <div class="image-container">
                    <img src="./anh04/03.jpg" alt="Basil">
                    <div class="overlay">154422411320 -8572</div>
                </div>
                <h3>Basil Leaves and Avocado on Sliced Bread</h3>
            </div>

            <div class="dish-card">
                <div class="image-container">
                    <img src="./anh04/04.jpg" alt="Grilled Meat">
                    <div class="overlay">15110516348-8d 96c70</div>
                </div>
                <h3>Grilled Meat</h3>
            </div>

            <div class="dish-card">
                <div class="image-container">
                    <img src="./anh04/05.jpg" alt="Fish">
                    <div class="overlay">transform scale.1</div>
                </div>
                <h3>Fish</h3>
            </div>

            <div class="dish-card">
                <div class="image-container">
                    <img src="./anh04/06.jpg" alt="Steak">
                    <div class="overlay">Steak</div>
                </div>
                <h3>Steak</h3>
            </div>
        </div>
    </section>

</body>
</html>
