<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Layout 60-20-20</title>
    <link rel="stylesheet" href="./05.css">
</head>
<body>

    <h2 style="text-align: center; font-family: Arial;">Món Nổi Bật Hôm Nay</h2>

    <div class="menu-container">
        
        <div class="row">
            <div class="card item-big">
                <div class="img-box">
                    <img src="./anh05/01.jpg" alt="Beef Tenderloin">
                </div>
                <div class="info">
                    <h3>Grilled Wagyu Beef Tenderloin</h3>
                    <p class="price">1.200.000 đ</p>
                </div>
            </div>

            <div class="card item-small">
                <div class="img-box">
                    <img src="./anh05/02.jpg" alt="Scallops">
                </div>
                <div class="info">
                    <h3>Seared Scallops</h3>
                    <p class="price">320.000 đ</p>
                </div>
            </div>

            <div class="card item-small">
                <div class="img-box">
                    <img src="./anh05/03.jpg" alt="Deviled Eggs">
                </div>
                <div class="info">
                    <h3>Truffle Deviled Eggs</h3>
                    <p class="price">180.000 đ</p>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="card item-medium">
                <div class="img-box">
                    <img src="./anh05/04.jpg" alt="Lobster Bisque">
                </div>
                <div class="info">
                    <h3>Lobster Bisque</h3>
                    <p class="price">420.000 đ</p>
                </div>
            </div>

            <div class="card item-medium">
                <div class="img-box">
                    <img src="./anh05/05.jpg" alt="Foie Gras">
                </div>
                <div class="info">
                    <h3>Pan-Seared Foie Gras</h3>
                    <p class="price">580.000 đ</p>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
