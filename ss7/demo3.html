<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .first{
            width:50px;
            height:50px;
            background-color:red;
            transition :all 2s ;
           
        }
        .first:hover{
            background-color : yellow;
            transform : skewX(90deg);
           
        }
        .second{
            width:50px;
            height:50px;
            background-color:blue;
          
        } 
        .third{
            width:50px;
            height:50px;
            background-color:green;
        
           
        }
       
    </style>
</head>
<body>
   <div class="container">
    <div class="first"></div>
    <div class="second"></div>
    <div class="third"></div>
   </div>
</body>
</html>
