<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
    }
    .box{
        width: 250px;
        padding:15px;
        margin: 10px;
        border:1px solid #ccc;
        border-radius: 8px;
        text-align: center;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .box h3{
        color: #05c8eb;
        font-family: sans-serif;
        margin-top: 0;
    }
    
    </style>
</head>
<body>
    <div class="container">
  <div class="box">
    <h3>Niềng răng</h3>
    <p>Điều chỉnh răng lệch lạc, mang lại hàm răng đều đẹp và nụ cười tự tin.</p>
  </div>

  <div class="box">
    <h3>Cấy ghép Implant</h3>
    <p>Giải pháp phục hình răng mất với công nghệ hiện đại, an toàn và bền lâu.</p>
  </div>

  <div class="box">
    <h3>Khám răng định kỳ</h3>
    <p>Kiểm tra và chăm sóc răng miệng thường xuyên để phòng ngừa các bệnh lý.</p>
  </div>
</div>
</body>
</html>
