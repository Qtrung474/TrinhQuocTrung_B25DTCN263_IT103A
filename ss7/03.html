<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <style>
    body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px;
    background-color: #f5f5f5;
}

.card {
    width: 450px;
    border: 1px solid #333;
    background-color: #fff;
}

.header {
    border-bottom: 1px solid #333;
    padding: 10px;
    color: #ff8c00;
    font-weight: bold;
    font-size: 1.2rem;
}

.card img {
    width: 100%;
    display: block;
}

.content {
    padding: 20px;
}

.name {
    margin: 0 0 10px 0;
    font-size: 1.5rem;
    color: #000;
}

.specialty {
    color: #00ff00;
    font-weight: bold;
    margin-bottom: 15px;
    font-size: 1.2rem;
}

.description {
    color: #555;
    line-height: 1.6;
    margin: 0;
}
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        ⭐ NHA SĨ NỔI BẬT
    </div>
    <img src="" alt="Bác sĩ">
    <div class="content">
        <h2 class="name">BS. Nguyễn Minh Tâm</h2>
        <p class="specialty">Nha khoa thẩm mỹ</p>
        <p class="description">
            Hơn 10 năm kinh nghiệm trong lĩnh vực nha khoa thẩm mỹ, 
            chuyên tẩy trắng răng, dán sứ và phục hình nụ cười.
        </p>
    </div>
</div>
</body>
</html>
